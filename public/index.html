<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 3</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="space"></div>
    <div class="mode-selection">
        <div class="mode-content">
            <h1>Vinod Kamraj Acharya</h1>

            <p class="mode-question">
                How do you want to reach my portfolio?
            </p>

            <div class="mode-options">
                <button class="mode-button journey-button">
                    <span class="mode-title">Journey Mode</span>
                    <span class="mode-description">Take the journey</span>
                </button>

                <button class="mode-button fast-button">
                    <span class="mode-title">Fast Travel</span>
                    <span class="mode-description">Go directly</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Journey Mode elements -->
    <div class="energy"></div>
    <div class="rocket">🚀</div>

    <div class="arrival-transition"></div>

    <script src="/js/script.js"></script>
</body>
</html>
